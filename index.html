  <!-- Nav -->
  <header class="sticky top-0 z-30 bg-cream/90 backdrop-blur border-b border-sand">
    <nav class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2">

        <span class="font-display font-bold text-lg tracking-tight">youwebit</span>

      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-stone-600">
        <a href="#que" class="hover:text-ink" x-text="t.nav_what"></a>
        <a href="#como" class="hover:text-ink" x-text="t.nav_how"></a>
        <a href="#precio" class="hover:text-ink" x-text="t.nav_price"></a>

  <!-- Hero -->

          <span class="w-1.5 h-1.5 rounded-full bg-clay"></span>
          <span x-text="t.hero_badge"></span>
        </p>
        <h1 class="mt-5 font-display font-bold text-4xl sm:text-5xl md:text-6xl leading-[1.05] tracking-tight" x-html="t.hero_h1"></h1>
        <p class="mt-6 text-lg text-stone-600 max-w-xl leading-relaxed" x-text="t.hero_p"></p>
        <div class="mt-8 flex flex-col sm:flex-row gap-3">
          <a href="#contacto" class="inline-flex justify-center items-center bg-clay text-cream font-semibold px-6 py-3.5 rounded-lg hover:bg-clay-dark transition" x-text="t.hero_cta"></a>
          <a href="#como" class="inline-flex justify-center items-center border border-stone-300 font-semibold px-6 py-3.5 rounded-lg hover:border-ink transition" x-text="t.hero_cta2"></a>
        </div>
        <p class="mt-5 text-sm text-stone-500" x-text="t.hero_note"></p>
      </div>

      <!-- Price card -->
      <div class="md:col-span-5">
        <div class="bg-white rounded-2xl border border-sand shadow-[0_20px_50px_-20px_rgba(28,25,23,0.25)] p-7">
          <p class="text-xs font-semibold uppercase tracking-widest text-stone-500" x-text="t.price_label"></p>
          <div class="mt-3 flex items-end gap-3">
            <span class="font-display font-bold text-6xl leading-none">180 €</span>
            <span class="text-stone-400 line-through text-xl mb-1.5">300 €</span>
          </div>

  <!-- What we build -->
  <section id="que" class="bg-white border-y border-sand">
    <div class="max-w-6xl mx-auto px-5 py-20">
      <div class="max-w-2xl">
        <h2 class="font-display font-bold text-3xl md:text-4xl tracking-tight" x-text="t.what_h2"></h2>
        <p class="mt-4 text-stone-600 text-lg" x-text="t.what_p"></p>
      </div>
      <div class="mt-12 grid md:grid-cols-3 gap-6">
        <template x-for="card in t.what_cards" :key="card.title">
          <div class="rounded-2xl border border-sand bg-cream p-7">
            <div class="w-11 h-11 rounded-xl bg-clay-pale text-clay-dark flex items-center justify-center" x-html="card.icon"></div>
            <h3 class="mt-5 font-display font-bold text-2xl" x-text="card.title"></h3>
            <p class="mt-3 text-stone-600 leading-relaxed" x-text="card.text"></p>
            <ul class="mt-4 flex flex-wrap gap-2">
              <template x-for="tag in card.tags" :key="tag">
                <li class="text-xs font-medium bg-white border border-sand rounded-full px-2.5 py-1 text-stone-600" x-text="tag"></li>
              </template>
            </ul>
          </div>
        </template>
      </div>
      <div class="mt-10 rounded-2xl bg-ink text-cream p-8 md:p-10 grid md:grid-cols-12 gap-6 items-center">
        <div class="md:col-span-8">

          <p class="mt-3 text-stone-300 leading-relaxed" x-text="t.uvp_p"></p>

        <div class="md:col-span-4 md:text-right">
          <a href="#contacto" class="inline-flex bg-clay text-cream font-semibold px-6 py-3.5 rounded-lg hover:bg-clay-light hover:text-ink transition" x-text="t.uvp_cta"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- How it works -->
  <section id="como" class="max-w-6xl mx-auto px-5 py-20">
    <div class="max-w-2xl">

      <p class="mt-4 text-stone-600 text-lg" x-text="t.how_p"></p>
    </div>

    <!-- Diagram -->
    <div class="mt-14 relative">
      <!-- Connector line (desktop) -->
      <svg class="hidden md:block absolute top-[52px] left-0 w-full h-6 text-clay-light" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true">
        <path d="M120 12 H 815" class="step-arrow" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
      <div class="grid md:grid-cols-3 gap-10 md:gap-8">
        <template x-for="(step, i) in t.how_steps" :key="step.title">
          <div class="relative text-center md:text-left">
            <!-- Mobile connector -->
            <div x-show="i < 2" class="md:hidden absolute left-1/2 -bottom-8 -translate-x-1/2 text-clay-light" aria-hidden="true">
              <svg class="w-5 h-6" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 0v18M4 13l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="relative z-10 inline-flex md:flex w-[104px] h-[104px] rounded-2xl bg-white border-2 border-clay-light items-center justify-center text-clay-dark shadow-sm" x-html="step.icon"></div>
            <div class="mt-5 flex items-center justify-center md:justify-start gap-3">
              <span class="inline-flex w-7 h-7 rounded-full bg-ink text-cream text-sm font-bold items-center justify-center" x-text="i + 1"></span>
              <h3 class="font-display font-bold text-2xl" x-text="step.title"></h3>
            </div>
            <p class="mt-3 text-stone-600 leading-relaxed max-w-sm mx-auto md:mx-0" x-text="step.text"></p>
            <p class="mt-3 inline-flex items-center gap-1.5 text-sm font-semibold text-clay-dark bg-clay-pale rounded-full px-3 py-1" x-text="step.time"></p>
          </div>
        </template>
      </div>
    </div>
  </section>

        <p class="mt-4 text-stone-600 text-lg leading-relaxed" x-text="t.pricing_p"></p>
        <p class="mt-4 text-stone-600 leading-relaxed" x-text="t.pricing_p2"></p>
      </div>

            </template>

            <p x-text="t.pricing_extra2"></p>
          </div>
        </div>
      </div>
    </div>

  <!-- FAQ -->

            <span x-text="item.q"></span>
            <svg class="w-5 h-5 flex-none transition-transform" :class="open && 'rotate-45'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12" stroke-linecap="round"/></svg>
          </button>
          <p x-show="open" x-collapse x-cloak class="pb-5 text-stone-600 leading-relaxed" x-text="item.a"></p>
        </div>
      </template>
    </div>
  </section>

    <div class="max-w-6xl mx-auto px-5 py-20 grid md:grid-cols-12 gap-10 items-center">
      <div class="md:col-span-7">

        <p class="mt-4 text-stone-300 text-lg leading-relaxed" x-text="t.contact_p"></p>
        <ol class="mt-6 space-y-2 text-stone-300 text-sm">
          <template x-for="tip in t.contact_tips" :key="tip">
            <li class="flex gap-2.5"><span class="text-clay-light">→</span><span x-text="tip"></span></li>
          </template>
        </ol>
      </div>
      <div class="md:col-span-5">
        <div class="rounded-2xl bg-white/5 border border-white/10 p-7">
          <p class="text-xs font-semibold uppercase tracking-widest text-stone-400" x-text="t.contact_label"></p>
          <a :href="'mailto:' + email + '?subject=' + encodeURIComponent(t.contact_subject)" class="mt-3 block font-display font-bold text-xl sm:text-2xl md:text-3xl break-words hover:text-clay-light transition" x-text="email"></a>
          <a :href="'mailto:' + email + '?subject=' + encodeURIComponent(t.contact_subject) + '&body=' + encodeURIComponent(t.contact_body)" class="mt-6 w-full inline-flex justify-center bg-clay text-cream font-semibold px-5 py-3.5 rounded-lg hover:bg-clay-light hover:text-ink transition" x-text="t.contact_cta"></a>
          <p class="mt-4 text-xs text-stone-400" x-text="t.contact_fine"></p>
        </div>
      </div>
    </div>
  </section>

  <footer class="border-t border-sand">
    <div class="max-w-6xl mx-auto px-5 py-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-stone-500">
      <p>© <span x-text="new Date().getFullYear()"></span> youwebit.com</p>
      <p x-text="t.footer"></p>
    </div>
  </footer>

    function site() {
      return {
        lang: 'es',

        get t() { return COPY[this.lang]; },
        init() {
          let saved = null;
          try { saved = localStorage.getItem('lang'); } catch (e) {}
          if (saved === 'es' || saved === 'en') { this.lang = saved; return; }
          const nav = (navigator.language || 'es').toLowerCase();
          this.lang = nav.startsWith('es') ? 'es' : 'en';
        },
        toggle() {
          this.lang = this.lang === 'es' ? 'en' : 'es';
          try { localStorage.setItem('lang', this.lang); } catch (e) {}
        },
      };
